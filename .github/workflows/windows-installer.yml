name: Build Isaac Windows Installer

on:
  push:
    branches: ["main", "feature/windows11-installer"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Isaac
        shell: pwsh
        env:
          ISAAC_DISABLE_VECTOR_MEMORY: "1"
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m py_compile isaac_core.py executor.py low_complexity.py memory.py relay.py logic.py watchdog.py task_checkpoint.py
          .\.venv\Scripts\python.exe -c "import app; print('Flask entrypoint OK')"
          .\.venv\Scripts\python.exe -m unittest tests_phase_a_stabilization tests_state_io tests_provider_configuration -q
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build IsaacSetup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Inno Setup 6\ISCC.exe'
          & $iscc 'installer\windows\Isaac.iss'
          if (-not (Test-Path 'dist\IsaacSetup.exe')) { throw 'IsaacSetup.exe was not created.' }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IsaacSetup-windows11
          path: dist/IsaacSetup.exe
          if-no-files-found: error
          retention-days: 30
