# Isaac CI — mirrors local validation from AGENTS.md
# py_compile → sanity_check.py → unittest (not pytest)

name: Python package

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "feat/**", "feature/**", "isaac-2.0/masterplan"]
  pull_request:
    branches: ["main", "isaac-2.0/masterplan"]

env:
  ISAAC_DISABLE_VECTOR_MEMORY: "1"

jobs:
  validate:
    # Pin the runner: ubuntu-latest (26.04) no longer ships Python 3.9 builds.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 flake8
          if [ -f requirements.txt ]; then pip install --retries 5 --timeout 60 -r requirements.txt; fi

      - name: Compile core modules
        run: |
          python -m py_compile \
            isaac_core.py executor.py low_complexity.py memory.py \
            relay.py logic.py watchdog.py task_checkpoint.py \
            isaac_runtime_audit.py motivation.py file_access.py owner_action.py browser.py \
            isaac_mcp.py tool_runtime.py goal_store.py goal_inquiry.py learning_engine.py \
            task_tool_state.py isaac_sentry.py

      - name: Sanity check
        run: python sanity_check.py

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run test suite
        run: |
          python -m unittest \
            tests_phase_a_stabilization \
            tests_state_io \
            tests_provider_configuration \
            tests_isaac20_capabilities \
            tests_isaac20_causal \
            tests_jules_agent \
            tests_isaac_30day_evidence \
            tests_isaac_runtime_audit \
            tests_key_health \
            tests_goal_completion \
            tests_prove_the_kernel \
            tests_sentry_privacy_defaults

      # Same harness on every interpreter only repeats ~40s of work.
      # Unit tests stay on 3.9, 3.10 and 3.11.
      - name: Run eval harness
        if: matrix.python-version == '3.11'
        run: python -m evals.eval_runner
