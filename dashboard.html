<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isaac · Cognitive Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Cyber / Glass Dynamic Tokens */
:root, html[data-theme="plasma"]{
  --bg-0:#07090e;--bg-1:rgba(15,20,30,0.85);--bg-2:rgba(22,30,45,0.75);--bg-3:#1a2334;
  --line:rgba(0,240,255,0.18);--line-hot:rgba(0,240,255,0.45);--text:#f0f6fc;--muted:#8b9eb7;--dim:#55667e;
  --rot:#ff4757;--blau:#00a8ff;--gruen:#2ed573;
  --owner:#ffa502;--isaac:#00f0ff;--warn:#eccc68;--danger:#ff4757;--info:#1e90ff;
  --isaac-soft:rgba(0,240,255,0.12);--owner-soft:rgba(255,165,2,0.12);
  --radius:16px;--radius-sm:10px;
  --font:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 16px 48px rgba(0,0,0,0.6);
  --glass-blur: blur(16px);
}
html[data-theme="violet"]{
  --bg-0:#08060d;--bg-1:rgba(21,16,33,0.85);--bg-2:rgba(32,24,50,0.75);--bg-3:#2c2045;
  --line:rgba(180,100,255,0.2);--line-hot:rgba(180,100,255,0.5);--text:#f8f5ff;--muted:#a395c2;--dim:#685a85;
  --rot:#ff5252;--blau:#7c4dff;--gruen:#69f0ae;
  --owner:#e040fb;--isaac:#b388ff;--warn:#ffd740;--danger:#ff5252;--info:#448aff;
  --isaac-soft:rgba(179,136,255,0.14);--owner-soft:rgba(224,64,251,0.12);
}
html[data-theme="ember"]{
  --bg-0:#0e0a07;--bg-1:rgba(28,20,15,0.85);--bg-2:rgba(42,30,22,0.75);--bg-3:#3c2a1c;
  --line:rgba(255,140,0,0.2);--line-hot:rgba(255,140,0,0.5);--text:#fff8f0;--muted:#c2a895;--dim:#856f5e;
  --rot:#ff3838;--blau:#17c0eb;--gruen:#32ff7e;
  --owner:#ffaf40;--isaac:#ff9f1a;--warn:#fff200;--danger:#ff3838;--info:#18dcff;
  --isaac-soft:rgba(255,159,26,0.14);--owner-soft:rgba(255,175,64,0.12);
}
html[data-theme="contrast"]{
  --bg-0:#040507;--bg-1:rgba(12,16,22,0.9);--bg-2:rgba(20,26,36,0.85);--bg-3:#1c2432;
  --line:rgba(255,255,255,0.22);--line-hot:rgba(255,255,255,0.6);--text:#ffffff;--muted:#9eabbb;--dim:#68788d;
  --rot:#ff4d4d;--blau:#3399ff;--gruen:#00e676;
  --owner:#ffbb00;--isaac:#00e5ff;--warn:#ffd600;--danger:#ff4d4d;--info:#29b6f6;
  --isaac-soft:rgba(0,229,255,0.15);--owner-soft:rgba(255,187,0,0.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body.dash{
  height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  font-family:var(--font);color:var(--text);
  background:
    radial-gradient(circle at 15% 10%, rgba(0,240,255,0.08), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(255,165,2,0.06), transparent 40%),
    var(--bg-0);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{
  background:rgba(0,0,0,0.4);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:.55rem .75rem;color:var(--text);backdrop-filter:var(--glass-blur);
}
input:focus,textarea:focus{outline:none;border-color:var(--isaac);box-shadow:0 0 12px var(--isaac-soft)}
.scroll-y{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.min0{min-height:0;min-width:0}
.shell{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;gap:12px}

/* Header */
.header{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg-1);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:1.1rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--isaac);text-shadow:0 0 10px var(--isaac-soft)}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500;letter-spacing:.02em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex-shrink:0}
.dot.on{background:var(--gruen);box-shadow:0 0 14px var(--gruen)}
.dot.boot{background:var(--warn);animation:pulse 1.2s infinite}
.dot.err{background:var(--danger);animation:pulse .7s infinite}
@keyframes pulse{50%{opacity:.4}}
.mode-tog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,0.3)}
.mode-tog button{padding:.4rem .85rem;font-size:.75rem;color:var(--muted);transition:.2s}
.mode-tog button.active{background:var(--isaac-soft);color:var(--isaac);font-weight:600}
.h-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:.3rem .65rem;border-radius:999px;
  border:1px solid var(--line);font-size:.72rem;color:var(--muted);background:rgba(0,0,0,0.3)
}
.chip.hot{border-color:var(--line-hot);color:var(--isaac);background:var(--isaac-soft)}
.chip.warn{border-color:rgba(255,200,80,0.4);color:var(--warn)}
.btn{
  padding:.45rem .8rem;border-radius:var(--radius-sm);border:1px solid var(--line-hot);
  background:var(--bg-2);font-size:.8rem;transition:all .18s ease;backdrop-filter:var(--glass-blur);
}
.btn:hover{border-color:var(--isaac);color:var(--isaac);box-shadow:0 0 12px var(--isaac-soft)}
.btn.danger{border-color:rgba(255,71,87,0.5);color:var(--danger)}
.btn.primary{background:var(--isaac-soft);border-color:var(--isaac);color:var(--isaac);font-weight:600}
.clock{font-family:var(--mono);font-size:.8rem;color:var(--dim);letter-spacing:.05em}

.theme-tog{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,0.3)}
.theme-tog button{padding:.35rem .6rem;font-size:.68rem;color:var(--muted);text-transform:capitalize}
.theme-tog button.active{background:var(--isaac-soft);color:var(--isaac);font-weight:600}

/* NOW Stream */
.now{
  flex:0 0 auto;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg-1);backdrop-filter:var(--glass-blur);
  padding:12px 16px;box-shadow:var(--shadow)
}
.now-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.now-head{font-size:1rem;font-weight:600;color:var(--text);line-height:1.3}
.now-sub{font-size:.78rem;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.now-phases{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.phase{flex:1;min-width:75px;text-align:center;position:relative;padding:6px 4px}
.phase::after{
  content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--line);z-index:0
}
.phase:last-child::after{display:none}
.phase-node{
  width:14px;height:14px;border-radius:50%;margin:0 auto 6px;position:relative;z-index:1;
  background:var(--dim);border:2px solid var(--bg-0)
}
.phase.done .phase-node{background:var(--gruen);box-shadow:0 0 10px var(--gruen)}
.phase.active .phase-node{background:var(--isaac);box-shadow:0 0 16px var(--isaac);animation:pulse 1.5s infinite}
.phase.blocked .phase-node{background:var(--danger)}
.phase-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.phase.active .phase-label{color:var(--isaac)}

/* Layout Grid Proportions */
.body{flex:1;min-height:0;display:grid;grid-template-columns:80px minmax(0,1fr) 360px;gap:12px}
body.focus .body{grid-template-columns:0 minmax(0,.4fr) minmax(0,1fr)}
body.focus .nav{display:none}
body.focus .stage-wrap{display:none}
body.focus .kpi-focus{display:grid}
.kpi-focus{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}

/* Nav */
.nav{
  min-height:0;display:flex;flex-direction:column;gap:6px;padding:10px 6px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-1);backdrop-filter:var(--glass-blur);overflow-y:auto
}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;
  border-radius:var(--radius-sm);color:var(--muted);font-size:.65rem;font-weight:500;transition:.2s
}
.nav button:hover,.nav button.active{background:var(--isaac-soft);color:var(--isaac)}
.nav button .ico{font-size:1.15rem;line-height:1}

/* Stage */
.stage-wrap{
  min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--bg-1);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow);overflow:hidden
}
.stage-bar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--line)
}
.stage-bar h2{font-size:.88rem;text-transform:uppercase;letter-spacing:.12em;color:var(--isaac);font-weight:700}
.stage{flex:1;min-height:0;overflow-y:auto;padding:16px;overscroll-behavior:contain}

/* Live Screen Mirror Styling */
.live-screen-wrap{display:flex;flex-direction:column;gap:12px;height:100%}
.live-hdr-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(0,0,0,0.4);border:1px solid var(--line);border-radius:var(--radius-sm)}
.live-tag{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.8rem;font-weight:700;color:var(--isaac)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--gruen);box-shadow:0 0 10px var(--gruen);animation:pulse 1.2s infinite}
.live-meta-group{display:flex;gap:6px;align-items:center}
.live-grid{display:grid;grid-template-columns:1fr 300px;gap:12px;flex:1;min-height:0}
.live-term-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius-sm);background:#05070a;overflow:hidden}
.term-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(15,20,30,0.9);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.btn-sm{padding:2px 8px;font-size:.68rem;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
.btn-sm:hover{color:var(--text);border-color:var(--isaac)}
.live-term-body{flex:1;min-height:260px;padding:12px;font-family:var(--mono);font-size:.75rem;line-height:1.5;display:flex;flex-direction:column;gap:4px;background:#030508}
.term-line{display:flex;gap:8px;flex-wrap:wrap;word-break:break-all}
.term-line .t-ts{color:var(--dim)}
.term-line .t-src{color:var(--isaac);font-weight:600}
.term-line .t-msg{color:#d1d5db}
.term-line.error .t-msg{color:var(--danger)}
.term-line.warn .t-msg{color:var(--warn)}
.term-line.success .t-msg{color:var(--gruen)}
.term-line .t-meta{color:var(--muted);font-size:.7rem;opacity:0.85}
.live-side-card{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg-2);overflow-y:auto}
.card-hdr{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--isaac);font-weight:700;margin-bottom:4px;border-bottom:1px solid var(--line);padding-bottom:4px}
.hot-txt{color:var(--isaac);font-weight:700}
.desc-txt{font-size:.78rem;color:var(--muted);word-break:break-word}
.mem-preview{max-height:160px;font-size:.68rem;background:rgba(0,0,0,0.5);padding:8px;border-radius:6px;border:1px solid var(--line)}

/* Chat Panel */
.chat-wrap{
  min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--bg-1);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow);overflow:hidden
}
.chat-bar{flex:0 0 auto;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.chat-bar h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.12em;color:var(--isaac);font-weight:700}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;font-size:.88rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.steffen{align-self:flex-end;background:var(--owner-soft);border:1px solid color-mix(in srgb, var(--owner) 40%, transparent)}
.msg.isaac{align-self:flex-start;background:var(--isaac-soft);border:1px solid color-mix(in srgb, var(--isaac) 35%, transparent)}
.msg.sys{align-self:center;background:transparent;color:var(--dim);font-size:.75rem;border:none;padding:4px}
.msg .who{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px;font-family:var(--mono)}
.composer{flex:0 0 auto;padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:70px;resize:vertical;max-height:160px;width:100%}
.composer-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:.7rem;padding:.25rem .55rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:.15s}
.quick button:hover{border-color:var(--owner);color:var(--owner)}

/* Shared Cards & KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:rgba(0,0,0,0.3)}
.kpi .k{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
.kpi .v{font-size:1.3rem;font-weight:700;font-family:var(--mono)}
.kpi .v.g{color:var(--gruen)}.kpi .v.y{color:var(--warn)}.kpi .v.r{color:var(--danger)}.kpi .v.c{color:var(--isaac)}.kpi .v.o{color:var(--owner)}
.card{padding:14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:rgba(0,0,0,0.25);margin-bottom:12px}
.card h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--isaac);margin-bottom:10px;font-weight:700}
.metric{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:.84rem}
.metric:last-child{border-bottom:none}
.metric span:first-child{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{padding:.35rem .7rem;border-radius:999px;border:1px solid var(--line);font-size:.75rem;color:var(--muted)}
.filters button.active{border-color:var(--isaac);color:var(--isaac);background:var(--isaac-soft)}

/* Tasks */
.task{border:1px solid var(--line);border-radius:var(--radius-sm);background:rgba(0,0,0,0.3);margin-bottom:10px;overflow:hidden}
.task.running{border-left:3px solid var(--warn)}
.task.done{border-left:3px solid var(--gruen)}
.task.failed{border-left:3px solid var(--danger)}
.task-h{display:grid;grid-template-columns:68px 76px 1fr 70px 48px 48px;gap:8px;align-items:center;padding:10px 12px;cursor:pointer;font-size:.82rem}
.task-h .mono{font-family:var(--mono);color:var(--dim);font-size:.72rem}
.task-h .typ{color:var(--isaac);font-weight:600}
.task-h .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-prog{height:4px;background:rgba(255,255,255,0.1)}
.task-prog>i{display:block;height:100%;background:var(--isaac)}
.task-d{display:none;padding:14px;border-top:1px solid var(--line);background:rgba(0,0,0,0.4)}
.task.exp .task-d{display:block}
.trace{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.trace-step{padding:8px 10px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;border-left:3px solid var(--line);background:rgba(0,0,0,0.3);font-size:.78rem}
.trace-step.classification,.trace-step.governance,.trace-step.strategy,.trace-step.motivation{border-left-color:var(--rot)}
.trace-step.retrieval,.trace-step.learning{border-left-color:var(--blau)}
.trace-step.execution,.trace-step.evaluation,.trace-step.selection,.trace-step.eligibility,.trace-step.context_integration{border-left-color:var(--gruen)}
.trace-meta{font-family:var(--mono);font-size:.68rem;color:var(--dim);margin-top:4px;word-break:break-all}
.tlog{max-height:160px;overflow-y:auto;font-family:var(--mono);font-size:.72rem;background:#000;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}

/* Tools map & Providers */
.cap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cap{padding:10px;border-radius:var(--radius-sm);border:1px solid var(--line);background:rgba(0,0,0,0.3);font-size:.8rem}
.cap .nm{font-weight:600;margin-bottom:4px}
.cap .meta{color:var(--muted);font-size:.72rem;font-family:var(--mono)}
.cap.on{border-color:rgba(46,213,115,0.4)}
.cap.off{opacity:.55}
.sec-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--isaac);margin:14px 0 8px;font-weight:700}
.prov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.prov{padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:rgba(0,0,0,0.3)}
.prov.primary{outline:1px solid var(--isaac)}

/* Log & Neural */
.log-row{display:grid;grid-template-columns:64px 100px 1fr;gap:8px;font-size:.75rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-family:var(--mono)}
.log-row .ts{color:var(--dim)}
.nbar{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin-bottom:6px;font-size:.78rem}
.nbar .trk{height:8px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden}
.nbar .trk>i{display:block;height:100%;background:linear-gradient(90deg,var(--blau),var(--isaac))}
.empty{color:var(--dim);font-size:.85rem;padding:20px;text-align:center}

/* Responsive Media Queries */
@media(max-width:1100px){
  .body{grid-template-columns:72px minmax(0,1fr) 300px}
  .live-grid{grid-template-columns:1fr}
}
@media(max-width:960px){
  body.dash{overflow:auto;height:auto;min-height:100dvh}
  .shell{height:auto}
  .body{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,60vh) minmax(320px,50vh)}
  body.focus .body{grid-template-columns:1fr}
  body.focus .stage-wrap{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;max-height:none;overflow:visible}
  .nav button{flex-direction:row;gap:6px;padding:8px 10px;font-size:.72rem}
  .task-h{grid-template-columns:50px 60px 1fr 50px;font-size:.72rem}
  .task-h .hide-m{display:none}
}
@media(prefers-reduced-motion:reduce){.phase.active .phase-node,.dot.boot,.dot.err,.live-dot{animation:none}}
</style>
</head>
<body class="dash cockpit">
<div class="shell">
  <header class="header">
    <div class="brand">
      <div id="conn-dot" class="dot boot"></div>
      <div>
        <h1>Isaac</h1>
        <small id="brand-sub">Cognitive Cockpit · v6</small>
      </div>
    </div>
    <div class="mode-tog" role="group" aria-label="Ansicht">
      <button type="button" id="mode-focus" onclick="setMode('focus')">Focus</button>
      <button type="button" id="mode-cockpit" class="active" onclick="setMode('cockpit')">Cockpit</button>
    </div>
    <div class="theme-tog" role="group" aria-label="Farbschema" id="theme-tog">
      <button type="button" data-theme="plasma" onclick="setTheme('plasma')">Cyan</button>
      <button type="button" data-theme="violet" onclick="setTheme('violet')">Violet</button>
      <button type="button" data-theme="ember" onclick="setTheme('ember')">Ember</button>
      <button type="button" data-theme="contrast" onclick="setTheme('contrast')">Contrast</button>
    </div>
    <span class="chip" id="sys-chip">…</span>
    <span class="chip hot" id="prov-chip" title="Primary provider">–</span>
    <div class="h-actions">
      <button type="button" class="btn" onclick="sendCmd('status')">Status</button>
      <button type="button" class="btn danger" id="pause-btn" onclick="togglePause()">Pause</button>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <section class="now" id="now" aria-label="NOW Stream">
    <div class="now-top">
      <div>
        <div class="now-head" id="now-head">Verbinde…</div>
        <div class="now-sub" id="now-sub">—</div>
      </div>
      <button type="button" class="btn" onclick="toggleNow()" aria-label="NOW ein/aus">▾</button>
    </div>
    <div class="now-phases" id="now-phases"></div>
  </section>

  <div class="kpi-focus" id="kpi-focus"></div>

  <div class="body">
    <nav class="nav scroll-y" id="nav" aria-label="Hauptnavigation"></nav>
    <div class="stage-wrap min0">
      <div class="stage-bar">
        <h2 id="stage-title">Überblick</h2>
        <span class="chip" id="stage-meta">Live</span>
      </div>
      <main class="stage scroll-y" id="stage" tabindex="0"></main>
    </div>
    <aside class="chat-wrap min0">
      <div class="chat-bar">
        <h2>Chat</h2>
        <button type="button" class="btn" onclick="clearChat()">Leeren</button>
      </div>
      <div class="msgs scroll-y" id="msgs" aria-live="polite"></div>
      <div class="composer">
        <div class="quick">
          <button type="button" onclick="quick('Hallo Isaac')">Hallo</button>
          <button type="button" onclick="quick('status:pipeline')">Pipeline</button>
          <button type="button" onclick="quick('ziele')">Ziele</button>
          <button type="button" onclick="quick('status:smoke')">Smoke</button>
        </div>
        <textarea id="chat-in" rows="3" placeholder="Nachricht an Isaac…" aria-label="Chat-Eingabe"></textarea>
        <div class="composer-row">
          <button type="button" class="btn primary" id="send-btn" onclick="sendChat()">Senden</button>
          <span class="chip" id="ws-label">WS …</span>
        </div>
      </div>
    </aside>
  </div>
</div>
<script>
/* ═══ Isaac Dashboard v6 — Cognitive Cockpit ═══
   Owner override: full dashboard redesign (AGENTS non-touch except explicit request).
   Scroll contract: shell 100dvh; stage + msgs + nav use .scroll-y + min-height:0.
*/
const PHASES = [
  {id:'input',label:'Eingabe',layer:'rot'},
  {id:'classification',label:'Klassif.',layer:'rot'},
  {id:'retrieval',label:'Retrieval',layer:'blau'},
  {id:'strategy',label:'Strategy',layer:'rot'},
  {id:'task',label:'Task',layer:'gruen'},
  {id:'execution',label:'Execute',layer:'gruen'},
  {id:'evaluation',label:'Eval',layer:'gruen'},
  {id:'memory',label:'Memory',layer:'blau'},
];
const NAV = [
  {id:'overview',label:'Überblick',ico:'◉'},
  {id:'live',label:'Live View',ico:'🖥'},
  {id:'tasks',label:'Tasks',ico:'▣'},
  {id:'memory',label:'Gedächtnis',ico:'◈'},
  {id:'tools',label:'Werkzeuge',ico:'⚒'},
  {id:'goals',label:'Ziele',ico:'◎'},
  {id:'providers',label:'Provider',ico:'⚙'},
  {id:'governance',label:'Verfassung',ico:'⚖'},
  {id:'neural',label:'Neural',ico:'⌬'},
  {id:'ops',label:'Ops',ico:'⬡'},
  {id:'audit',label:'Audit',ico:'☰'},
];

const S = {
  mode: localStorage.getItem('isaac.dash.mode') || 'cockpit',
  theme: localStorage.getItem('isaac.dash.theme') || 'plasma',
  nav: localStorage.getItem('isaac.dash.nav') || 'live',
  online: false,
  paused: false,
  ws: null,
  state: {},
  now: {},
  tasks: {},
  audit: [],
  tools: [],
  liveLogs: [],
  expandedTasks: new Set(),
  taskFilter: 'all',
  logFilter: 'all',
  reconnectMs: 1200,
  _raf: 0,
  _nearBottom: true,
};

function esc(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function $(id){return document.getElementById(id)}
function nowClock(){
  const d=new Date();
  $('clock').textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(nowClock,1000); nowClock();


function setTheme(name){
  const allowed=['plasma','violet','ember','contrast'];
  if(!allowed.includes(name)) name='plasma';
  S.theme=name;
  localStorage.setItem('isaac.dash.theme', name);
  document.documentElement.setAttribute('data-theme', name);
  document.querySelectorAll('#theme-tog button').forEach(b=>{
    b.classList.toggle('active', b.dataset.theme===name);
  });
}

function setMode(m){
  S.mode=m; localStorage.setItem('isaac.dash.mode',m);
  document.body.classList.toggle('focus', m==='focus');
  document.body.classList.toggle('cockpit', m==='cockpit');
  $('mode-focus').classList.toggle('active', m==='focus');
  $('mode-cockpit').classList.toggle('active', m==='cockpit');
  renderKpiFocus();
}
function setNav(id){
  S.nav=id; localStorage.setItem('isaac.dash.nav',id);
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===id));
  const n=NAV.find(x=>x.id===id);
  $('stage-title').textContent=n?n.label:id;
  scheduleRender();
}
function toggleNow(){
  const p=$('now-phases');
  p.style.display=p.style.display==='none'?'flex':'none';
}

function buildNav(){
  $('nav').innerHTML=NAV.map(n=>
    `<button type="button" data-nav="${n.id}" class="${S.nav===n.id?'active':''}" onclick="setNav('${n.id}')">
      <span class="ico" aria-hidden="true">${n.ico}</span>${esc(n.label)}
    </button>`
  ).join('');
}

function renderNow(){
  const n=S.now||{};
  $('now-head').textContent=n.headline||'Isaac wartet…';
  $('now-sub').textContent=n.subline||(S.online?'Live':'Offline');
  const ph=n.phases||{};
  const active=n.pipeline_phase||'idle';
  $('now-phases').innerHTML=PHASES.map(p=>{
    const st=(ph[p.id]&&ph[p.id].status)||(active===p.id?'active':active==='idle'?'idle':'idle');
    let cls=st;
    if(active!=='idle' && st==='idle'){
      const order=PHASES.map(x=>x.id);
      if(order.indexOf(p.id)<order.indexOf(active)) cls='done';
    }
    if(active===p.id) cls='active';
    return `<div class="phase ${cls} layer-${p.layer}" title="${esc(p.label)}">
      <div class="phase-node"></div>
      <div class="phase-label">${esc(p.label)}</div>
    </div>`;
  }).join('');
  $('brand-sub').textContent=n.headline?String(n.headline).slice(0,48):'Cognitive Cockpit · v6';
}

function kpi(label,val,cls){
  return `<div class="kpi"><div class="k">${esc(label)}</div><div class="v ${cls||''}">${val}</div></div>`;
}
function renderKpiFocus(){
  if(S.mode!=='focus') return;
  const ex=S.state.executor||{};
  const g=S.state.goals||{};
  $('kpi-focus').innerHTML=[
    kpi('Running', ex.running??ex.running_count??0, 'y'),
    kpi('Queue', ex.queued??ex.queue??0),
    kpi('Ziele', g.count??(g.active||[]).length??0, 'c'),
    kpi('Score', ex.avg_score!=null?Number(ex.avg_score).toFixed(1):'–', 'g'),
  ].join('');
}

function scheduleRender(){
  if(S._raf) return;
  S._raf=requestAnimationFrame(()=>{ S._raf=0; renderStage(); renderNow(); renderKpiFocus(); });
}

function pushLiveLog(source, type, msg, meta){
  const ts = new Date().toLocaleTimeString('de-DE', {hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
  S.liveLogs.push({ ts, source, type, msg, meta: meta ? JSON.stringify(meta) : '' });
  if (S.liveLogs.length > 400) S.liveLogs = S.liveLogs.slice(-400);
  if (S.nav === 'live') {
    const term = $('live-term-out');
    if (term) {
      const line = document.createElement('div');
      line.className = 'term-line ' + (type || 'info');
      line.innerHTML = `<span class="t-ts">[${ts}]</span> <span class="t-src">[${esc(source)}]</span> <span class="t-msg">${esc(msg)}</span> ${meta ? `<span class="t-meta">${esc(JSON.stringify(meta))}</span>` : ''}`;
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }
  }
}

function renderLive(){
  const n = S.now || {};
  const activeTask = n.active_task_id ? (S.tasks[n.active_task_id] || {}) : {};
  const logs = S.liveLogs.slice(-150);

  return `
    <div class="live-screen-wrap">
      <div class="live-hdr-bar">
        <div class="live-tag"><span class="live-dot"></span> LIVE SCREEN MIRROR</div>
        <div class="live-meta-group">
          <span class="chip hot">Phase: ${esc(n.pipeline_phase || 'IDLE')}</span>
          <span class="chip">Provider: ${esc(n.provider || 'default')}</span>
          <span class="chip warn">Task: ${esc((n.active_task_id || 'NONE').slice(0, 10))}</span>
        </div>
      </div>

      <div class="live-grid">
        <div class="live-term-card">
          <div class="term-bar">
            <span>ISAAC CONSOLE FEED // STDOUT</span>
            <button type="button" class="btn-sm" onclick="S.liveLogs=[];scheduleRender();">Clear Feed</button>
          </div>
          <div class="live-term-body scroll-y" id="live-term-out">
            ${logs.length ? logs.map(l => `
              <div class="term-line ${esc(l.type)}">
                <span class="t-ts">[${esc(l.ts)}]</span>
                <span class="t-src">[${esc(l.source)}]</span>
                <span class="t-msg">${esc(l.msg)}</span>
                ${l.meta ? `<span class="t-meta">${esc(l.meta)}</span>` : ''}
              </div>
            `).join('') : '<div class="term-line info"><span class="t-msg">Warte auf Live-Aktivitäten von Isaac...</span></div>'}
          </div>
        </div>

        <div class="live-side-card">
          <div class="card-hdr">Aktive Kognition</div>
          <div class="metric"><span>Intent</span><span class="mono">${esc(n.intent || 'Standby')}</span></div>
          <div class="metric"><span>Sub-Goal</span><span class="mono">${esc((n.strategy && n.strategy.subgoal) || '—')}</span></div>
          <div class="metric"><span>Tools</span><span class="mono">${n.strategy && n.strategy.allow_tools ? 'ERLAUBT' : 'GESPERRT'}</span></div>
          <div class="metric"><span>Active Tool</span><span class="mono hot-txt">${esc(n.active_tool || 'Keines')}</span></div>

          <div class="card-hdr" style="margin-top:14px">Execution Telemetry</div>
          <div class="metric"><span>Prompt / Task</span><span class="desc-txt">${esc(activeTask.beschreibung || activeTask.prompt || 'Kein aktiver Task')}</span></div>
          <div class="metric"><span>Status</span><span class="mono">${esc(activeTask.status || 'IDLE')}</span></div>
          <div class="metric"><span>Progress</span><span class="mono">${Math.min(100, Math.round((Number(activeTask.progress) || 0) * 100))}%</span></div>

          <div class="card-hdr" style="margin-top:14px">Working Memory Buffer</div>
          <div class="mem-preview mono scroll-y">
            ${esc(JSON.stringify(S.state.memory || {}, null, 2).slice(0, 450))}
          </div>
        </div>
      </div>
    </div>`;
}

function renderStage(){
  const el=$('stage');
  const fn={
    overview: renderOverview,
    live: renderLive,
    tasks: renderTasks,
    memory: renderMemory,
    tools: renderTools,
    goals: renderGoals,
    providers: renderProviders,
    governance: renderGovernance,
    neural: renderNeural,
    ops: renderOps,
    audit: renderAudit,
  }[S.nav]||renderLive;
  el.innerHTML=fn();
}

function renderOverview(){
  const s=S.state, ex=s.executor||{}, mem=s.memory||{}, n=S.now||{};
  const run=(s.running||[]).length || ex.running || 0;
  return `
    <div class="kpi-grid">
      ${kpi('Running', run, 'y')}
      ${kpi('Queue', ex.queued??ex.queue??0)}
      ${kpi('Tasks total', ex.total??ex.tasks_total??Object.keys(S.tasks).length)}
      ${kpi('Avg Score', ex.avg_score!=null?Number(ex.avg_score).toFixed(2):'–', 'g')}
      ${kpi('Fakten', mem.facts??mem.facts_count??'–', 'c')}
      ${kpi('Tools', (s.tools||S.tools||[]).length, 'o')}
      ${kpi('Ziele', (s.goals&&s.goals.count)||0, 'c')}
      ${kpi('Missionen', (s.missions&&s.missions.count)||0)}
    </div>
    <div class="card">
      <h3>NOW · Kernel</h3>
      <div class="metric"><span>Phase</span><span>${esc(n.pipeline_phase||'idle')}</span></div>
      <div class="metric"><span>Intent</span><span>${esc(n.intent||'—')}</span></div>
      <div class="metric"><span>Provider</span><span>${esc(n.provider||'—')}</span></div>
      <div class="metric"><span>Task</span><span class="mono">${esc(n.active_task_id||'—')}</span></div>
      <div class="metric"><span>Tools erlaubt</span><span>${n.strategy&&n.strategy.allow_tools?'ja':'nein'}</span></div>
    </div>
    <div class="card">
      <h3>System</h3>
      <div class="metric"><span>Paused</span><span>${s.paused?'ja':'nein'}</span></div>
      <div class="metric"><span>Browser automation</span><span>${(s.settings||{}).browser_automation?'an':'aus'}</span></div>
      <div class="metric"><span>Free cloud</span><span>${(s.settings||{}).free_only_providers?'free-only': '—'}</span></div>
      <div class="metric"><span>Owner</span><span>${esc((s.settings||{}).owner_name||'Steffen')}</span></div>
    </div>`;
}

function renderTasks(){
  const list=Object.values(S.tasks).sort((a,b)=>(b.erstellt||'').localeCompare(a.erstellt||''));
  const f=S.taskFilter;
  const filtered=list.filter(t=>{
    const st=String(t.status||'').toLowerCase();
    if(f==='all') return true;
    if(f==='running') return ['running','evaluating','followup'].includes(st);
    return st===f;
  }).slice(0,100);
  const filters=['all','running','done','failed','queued','evaluating'];
  return `
    <div class="filters">${filters.map(x=>
      `<button type="button" class="${f===x?'active':''}" onclick="S.taskFilter='${x}';scheduleRender()">${x}</button>`
    ).join('')}</div>
    ${filtered.length?filtered.map(taskRow).join(''):'<div class="empty">Keine Tasks</div>'}`;
}
function toggleTaskExp(id){
  const sid = String(id);
  if (S.expandedTasks.has(sid)) {
    S.expandedTasks.delete(sid);
  } else {
    S.expandedTasks.add(sid);
  }
  scheduleRender();
}

function taskRow(t){
  const st=String(t.status||'queued').toLowerCase();
  const prog=Math.min(100,Math.round((Number(t.progress)||0)*100));
  const score=t.score!=null?Number(t.score).toFixed(1):(t.score_detail&&t.score_detail.gesamt!=null?Number(t.score_detail.gesamt).toFixed(1):'–');
  const trace=Array.isArray(t.decision_trace)?t.decision_trace:[];
  const traceHtml=trace.length?`<div class="trace">${trace.map((e,i)=>{
    const phase=String(e.phase||'unknown').toLowerCase();
    const data=e.data?esc(JSON.stringify(e.data).slice(0,240)):'';
    return `<div class="trace-step ${esc(phase)}"><strong>${i+1}. ${esc(phase)} · ${esc(e.event||'–')}</strong>
      ${data?`<div class="trace-meta">${data}</div>`:''}</div>`;
  }).join('')}</div>`:'<div class="empty" style="padding:8px">Kein DecisionTrace</div>';
  const log=(t.log||[]).slice(-30).map(e=>`<div><span style="color:var(--dim)">${esc(e.ts||'')}</span> ${esc(e.msg||'')}</div>`).join('');
  const isExp = S.expandedTasks.has(String(t.id));
  return `<div class="task ${esc(st)} ${isExp?'exp':''}" id="task-${esc(t.id)}">
    <div class="task-h" onclick="toggleTaskExp('${esc(t.id)}')">
      <span class="mono">${esc(String(t.id||'').slice(0,8))}</span>
      <span class="typ">${esc(t.typ||t.type||'—')}</span>
      <span class="desc">${esc(t.beschreibung||t.prompt||'—')}</span>
      <span class="mono hide-m">${esc(st)}</span>
      <span class="mono hide-m">${esc(score)}</span>
      <span class="mono">${prog}%</span>
    </div>
    <div class="task-prog"><i style="width:${prog}%"></i></div>
    <div class="task-d">
      <div class="sec-title">Antwort</div>
      <div style="font-size:.84rem;margin-bottom:10px">${esc(t.antwort_kurz||t.fehler||'—')}</div>
      <div class="sec-title">Causal Timeline · DecisionTrace (${trace.length})</div>
      ${traceHtml}
      <div class="sec-title">Live-Log</div>
      <div class="tlog">${log||'—'}</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button type="button" class="btn danger" onclick="cancelTask('${esc(t.id)}')">Abbrechen</button>
        <button type="button" class="btn" onclick="resumeTask('${esc(t.id)}')">Resume</button>
      </div>
    </div>
  </div>`;
}

function renderMemory(){
  const m=S.state.memory||{}, dirs=S.state.directives||[], oq=S.state.open_questions||[];
  return `
    <div class="kpi-grid">
      ${kpi('Konversationen', m.conversations??m.conv??'–')}
      ${kpi('Fakten', m.facts??'–', 'c')}
      ${kpi('Working', m.working_memory??m.working??'–')}
      ${kpi('Procedures', m.procedures??'–')}
    </div>
    <div class="card"><h3>Direktiven (${dirs.length})</h3>
      ${dirs.length?dirs.map(d=>`<div class="metric"><span>${esc(d.text||d)}</span>
        <button class="btn danger" style="padding:.2rem .4rem;font-size:.7rem" onclick="revokeDir('${esc(d.id)}')">×</button></div>`).join(''):
        '<div class="empty">Keine</div>'}
      <div style="display:flex;gap:8px;margin-top:10px">
        <input id="dir-in" placeholder="Neue Direktive…" style="flex:1">
        <button class="btn primary" onclick="addDir()">Setzen</button>
      </div>
    </div>
    <div class="card"><h3>Offene Fragen</h3>
      ${oq.length?oq.map(q=>`<div class="metric"><span>${esc(q.text||q.frage||JSON.stringify(q))}</span></div>`).join(''):
        '<div class="empty">Keine offenen Fragen</div>'}
    </div>`;
}

function renderTools(){
  const tools=S.state.tools||S.tools||[];
  const by={};
  tools.forEach(t=>{
    const c=t.category||t.kind||'general';
    (by[c]=by[c]||[]).push(t);
  });
  const cats=Object.keys(by).sort();
  if(!cats.length) return '<div class="empty">Keine Tools in Registry</div>';
  return cats.map(c=>`
    <div class="sec-title">${esc(c)} · ${by[c].length}</div>
    <div class="cap-grid">${by[c].map(t=>`
      <div class="cap ${t.active===false?'off':'on'}">
        <div class="nm">${esc(t.name||t.tool_id)}</div>
        <div class="meta">${esc(t.kind||'')} · ${esc(t.last_status||'unknown')} · trust ${esc(t.trust??'–')}</div>
      </div>`).join('')}
    </div>`).join('');
}

function renderGoals(){
  const g=S.state.goals||{}, m=S.state.missions||{}, smoke=S.state.remote_smoke||{};
  const active=g.active||[];
  const mot=g.next_motivation;
  const miss=m.active||[];
  return `
    <div class="kpi-grid">
      ${kpi('Aktive Ziele', g.count??active.length, 'c')}
      ${kpi('Missionen', m.count??miss.length, 'o')}
      ${kpi('Smoke last', smoke.last_ok==null?'–':(smoke.last_ok?'ok':'fail'), smoke.last_ok?'g':'r')}
    </div>
    <div class="card"><h3>Owner-Ziele</h3>
      ${active.length?active.map(x=>`<div class="metric"><span>${esc(x.title)}</span><span class="mono">${esc(x.priority)}</span></div>`).join(''):
        '<div class="empty">Keine aktiven Ziele — im Chat: Ziel: …</div>'}
      ${mot?`<div style="margin-top:8px;font-size:.8rem;color:var(--isaac)">Next: ${esc(mot.goal_title)} → ${esc(mot.subgoal_title)}</div>`:''}
    </div>
    <div class="card"><h3>Execution Missions</h3>
      ${miss.length?miss.map(x=>`<div class="metric"><span>${esc(x.title)}</span>
        <span class="mono">${esc(x.kind)} · steps ${esc(x.steps_done)}</span></div>`).join(''):
        '<div class="empty">Keine aktiven Missionen</div>'}
    </div>`;
}

function setPrimaryProvider(pid){
  send({typ:'set_provider', provider:pid});
}

function renderProviders(){
  const list=S.state.providers||[];
  const arr=Array.isArray(list)?list:Object.entries(list).map(([k,v])=>({id:k,...(v||{})}));
  const primary=(S.state.settings||{}).active_provider||'';
  if(!arr.length) return '<div class="empty">Keine Provider-Daten</div>';
  return `<div class="prov-grid">${arr.map(p=>{
    const id=p.id||p.name||p.provider||'?';
    const ok=p.available||p.ok||p.enabled;
    const isPrimary = id===primary;
    return `<div class="prov ${isPrimary?'primary':''}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:700;color:var(--isaac)">${esc(id)}</span>
        ${isPrimary ? '<span class="chip hot">PRIMARY</span>' : `<button type="button" class="btn-sm" onclick="setPrimaryProvider('${esc(id)}')">Set Active</button>`}
      </div>
      <div class="meta" style="color:var(--muted);font-size:.75rem;margin-top:8px">
        ${ok?'erreichbar':'—'} · ${esc(p.model||p.default_model||'')}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderGovernance(){
  const gv=S.state.governance||{}, rw=S.state.regelwerk||{};
  return `
    <div class="card"><h3>Verfassung / Self-Model</h3>
      <div class="metric"><span>Constitution</span><span>${esc(gv.constitution_version||'—')}</span></div>
      <div class="metric"><span>Self-Model Phase</span><span>${esc(gv.self_model_phase||'—')}</span></div>
      <div class="metric"><span>Procedures</span><span>${esc(gv.procedures_total??'—')}</span></div>
      <div class="metric"><span>Dev events (recent)</span><span>${esc(gv.development_recent??'—')}</span></div>
    </div>
    <div class="card"><h3>Regelwerk</h3>
      <div class="metric"><span>Aktive Regeln</span><span>${esc(rw.regeln_aktiv??rw.active??'—')}</span></div>
      <div class="metric"><span>Offene Fragen</span><span>${esc(rw.offene_fragen??'—')}</span></div>
    </div>
    <div class="card"><h3>Gate</h3>
      <pre style="font-size:.72rem;font-family:var(--mono);color:var(--muted);white-space:pre-wrap">${esc(JSON.stringify(S.state.gate||{},null,2).slice(0,800))}</pre>
    </div>`;
}

function renderNeural(){
  const n=S.state.neural||{};
  const regions=n.regions||n.region_weights||{};
  const entries=Object.entries(regions);
  return `
    <div class="kpi-grid">
      ${kpi('Regionen', n.region_count??entries.length??7, 'c')}
      ${kpi('Synapsen', n.synapses??n.synapse_count??'–')}
      ${kpi('Ø Gewicht', n.avg_weight!=null?Number(n.avg_weight).toFixed(3):'–', 'g')}
    </div>
    <div class="card"><h3>Regionen</h3>
      ${entries.length?entries.map(([k,v])=>{
        const w=typeof v==='number'?v:(v&&v.weight)||0;
        const pct=Math.min(100,Math.round(Math.abs(w)*100));
        return `<div class="nbar"><span>${esc(k)}</span><div class="trk"><i style="width:${pct}%"></i></div>
          <span class="mono">${Number(w).toFixed(2)}</span></div>`;
      }).join(''):'<div class="empty">Keine Neural-Daten</div>'}
    </div>`;
}

function toggleSetting(key, currentVal){
  send({typ:'toggle_setting', key: key, value: !currentVal});
}

      <div class="metric">
        <span>Browser Automation</span>
        <button type="button" class="btn-sm" onclick="toggleSetting('browser_automation', ${!!set.browser_automation})">
          ${set.browser_automation ? 'AN (Disable)' : 'AUS (Enable)'}
        </button>
      </div>
      <div class="metric">
        <span>Free-Only Provider Mode</span>
        <button type="button" class="btn-sm" onclick="toggleSetting('free_only_providers', ${!!set.free_only_providers})">
          ${set.free_only_providers ? 'FREE ONLY (Toggle)' : 'ALL PROVIDERS (Toggle)'}
        </button>
      </div>
      <div class="metric">
        <span>System Execution Gate</span>
        <button type="button" class="btn-sm ${S.paused?'primary':'danger'}" onclick="togglePause()">
          ${S.paused ? 'PAUSED (Click to Resume)' : 'RUNNING (Click to Pause)'}

      </div>

      <div class="metric"><span>Zyklen</span><span class="mono">${esc(bg.zyklen??'—')}</span></div>
      <div class="metric"><span>Goal-Autonomie ticks</span><span class="mono">${esc(bg.goal_autonomy_ticks??0)}</span></div>
      <div class="metric"><span>Mission ticks</span><span class="mono">${esc(bg.mission_ticks??0)}</span></div>
      <div class="metric"><span>Remote-smoke ticks (lokal)</span><span class="mono">${esc(bg.remote_smoke_ticks??0)}</span></div>
      <div class="metric"><span>ISAAC_REMOTE_SMOKE</span><span>${sm.enabled?'an':'aus'}</span></div>

      <div class="metric"><span>Active provider</span><span>${esc(set.active_provider||n.provider||'—')}</span></div>
      <div class="metric"><span>Monitor push</span><span>${esc(set.monitor_push_interval??'—')}s</span></div>

      <div class="metric"><span>Last ok</span><span>${sm.last_ok==null?'–':sm.last_ok?'ok':'fail'}</span></div>

function renderAudit(){
  const f=S.logFilter;
  let rows=S.audit.slice(-200).reverse();
  if(f!=='all') rows=rows.filter(e=>String(e.typ||e.type||e.kind||'').toLowerCase().includes(f));
  const filters=['all','task','error','steffen','isaac','quality'];
  return `
    <div class="filters">${filters.map(x=>
      `<button type="button" class="${f===x?'active':''}" onclick="S.logFilter='${x}';scheduleRender()">${x}</button>`
    ).join('')}</div>
    ${rows.length?rows.map(e=>`
      <div class="log-row">
        <span class="ts">${esc(e.ts||e.time||'')}</span>
        <span>${esc(e.typ||e.type||e.kind||'')}</span>
        <span>${esc(e.msg||e.message||e.text||JSON.stringify(e).slice(0,120))}</span>
      </div>`).join(''):'<div class="empty">Kein Audit</div>'}`;
}

/* ═══ Chat ═══ */
function addMsg(who, text){
  const box=$('msgs');
  const d=document.createElement('div');
  d.className='msg '+who;
  const label=who==='steffen'?'Steffen':who==='isaac'?'Isaac':'System';
  d.innerHTML=`<div class="who">${label}</div><div class="body"></div>`;
  d.querySelector('.body').textContent=text;
  box.appendChild(d);
  if(S._nearBottom) box.scrollTop=box.scrollHeight;
}
function clearChat(){ $('msgs').innerHTML=''; addMsg('sys','Chat geleert'); }
$('msgs').addEventListener('scroll',()=>{
  const el=$('msgs');
  S._nearBottom=(el.scrollHeight-el.scrollTop-el.clientHeight)<80;
});

function sendChat(){
  const t=$('chat-in').value.trim();
  if(!t) return;
  addMsg('steffen', t);
  $('chat-in').value='';
  send({typ:'chat', text:t});
}
function quick(t){ $('chat-in').value=t; sendChat(); }
$('chat-in').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
});

/* ═══ WS ═══ */
function setOnline(on){
  S.online=on;
  const d=$('conn-dot');
  d.className='dot '+(on?'on':'err');
  $('sys-chip').textContent=on?(S.paused?'PAUSIERT':'ONLINE'):'OFFLINE';
  $('ws-label').textContent=on?'WS open':'WS …';
}
function send(obj){
  if(S.ws && S.ws.readyState===1) S.ws.send(JSON.stringify(obj));
  else addMsg('sys','Nicht verbunden');
}
function sendCmd(c){ send({typ:'command', text:c}); }
function togglePause(){
  if(S.paused){ send({typ:'resume'}); } else { send({typ:'pause'}); }
}
function cancelTask(id){ send({typ:'cancel_task', task_id:id}); }
function resumeTask(id){
  fetch('/api/tasks/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id})})
    .then(r=>r.json()).then(j=>addMsg('sys','Resume: '+(j.ok?'ok':j.error||'fail'))).catch(e=>addMsg('sys',String(e)));
}
function addDir(){
  const t=$('dir-in').value.trim(); if(!t) return;
  send({typ:'set_directive', text:t, priority:10});
  $('dir-in').value='';
}
function revokeDir(id){ send({typ:'revoke_directive', id:id}); }

function handle(msg){
  switch(msg.typ){
    case 'init':
    case 'state':
      applyState(msg.state||{});
      break;
    case 'now':
      S.now=msg.now||msg;
      if (S.now.pipeline_phase) {
        pushLiveLog('PIPELINE', 'info', `Pipeline Phase: ${S.now.pipeline_phase} | Intent: ${S.now.intent || '—'}`);
      }
      renderNow();
      if(S.nav==='live') scheduleRender();
      break;
    case 'tasks':
      (msg.tasks||[]).forEach(t=>{ if(t&&t.id) S.tasks[t.id]=t; });
      if(S.nav==='tasks'||S.nav==='live') scheduleRender();
      break;
    case 'task_update':
      if(msg.task&&msg.task.id){
        S.tasks[msg.task.id]=msg.task;
        pushLiveLog('TASK', msg.task.status === 'failed' ? 'error' : msg.task.status === 'done' ? 'success' : 'warn',
          `Task [${msg.task.id.slice(0,8)}] ${msg.task.status || 'updated'}: ${msg.task.beschreibung || msg.task.prompt || ''}`,
          msg.task.antwort_kurz ? { antwort: msg.task.antwort_kurz } : null
        );
        if(S.nav==='tasks'||S.nav==='live') scheduleRender();
      }
      break;
    case 'audit':
      (msg.entries||[]).forEach(e=>S.audit.push(e));
      if(S.audit.length>500) S.audit=S.audit.slice(-500);
      if(S.nav==='audit') scheduleRender();
      break;
    case 'audit_event':
      if(msg.entry){
        S.audit.push(msg.entry);
        pushLiveLog(msg.entry.source || msg.entry.typ || 'SYSTEM',
          msg.entry.level || (msg.entry.error ? 'error' : 'info'),
          msg.entry.msg || msg.entry.message || JSON.stringify(msg.entry),
          msg.entry.meta || null
        );
        if(S.nav==='audit'||S.nav==='live') scheduleRender();
      }
      break;
    case 'chat_response':
      addMsg('isaac', msg.text||'');
      pushLiveLog('CHAT', 'info', `Isaac: ${msg.text || ''}`);
      break;
    case 'directives':
      if(S.state) S.state.directives=msg.directives||[];
      if(S.nav==='memory') scheduleRender();
      break;
    case 'providers':
      if(S.state) S.state.providers=msg.providers||[];
      if(S.nav==='providers') scheduleRender();
      break;
    case 'system':
      S.paused=msg.event==='paused';
      $('pause-btn').textContent=S.paused?'Weiter':'Pause';
      setOnline(S.online);
      break;
    case 'fehler':
      addMsg('sys', 'Fehler: '+(msg.msg||''));
      break;
    case 'ok':
      addMsg('sys', msg.msg||'ok');
      break;
    default: break;
  }
}

function applyState(st){
  if(!st||typeof st!=='object') return;
  S.state=st;
  S.now=st.now||S.now||{};
  S.paused=!!st.paused;
  if(st.tools) S.tools=st.tools;
  $('pause-btn').textContent=S.paused?'Weiter':'Pause';
  const p=(st.settings&&st.settings.active_provider)||(S.now&&S.now.provider)||'–';
  $('prov-chip').textContent=p;
  setOnline(S.online);
  scheduleRender();
}

async function connect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const urls=[
    proto+'//'+location.host+'/ws',
    proto+'//'+location.hostname+':8765/ws',
    proto+'//'+location.hostname+':8767/ws',
  ];
  for(const url of urls){
    try{
      const ws=new WebSocket(url);
      const ok=await new Promise(res=>{
        const t=setTimeout(()=>res(false),4000);
        ws.addEventListener('open',()=>{clearTimeout(t);res(true)},{once:true});
        ws.addEventListener('error',()=>{clearTimeout(t);res(false)},{once:true});
      });
      if(!ok){ try{ws.close()}catch(_){ } continue; }
      S.ws=ws;
      ws.onmessage=e=>{ try{ handle(JSON.parse(e.data)); }catch(err){ console.error(err);} };
      ws.onclose=()=>{ setOnline(false); addMsg('sys','WS getrennt — reconnect…'); setTimeout(connect, S.reconnectMs); };
      ws.onerror=()=>{ try{ws.close()}catch(_){ } };
      setOnline(true);
      addMsg('sys','Verbunden: '+url);
      $('ws-label').textContent='WS open';
      return;
    }catch(e){ console.error(e); }
  }
  setOnline(false);
  addMsg('sys','WS fehlgeschlagen');
  setTimeout(connect, 3000);
}

/* boot */
buildNav();
setMode(S.mode);
setTheme(S.theme);
setNav(S.nav);
PHASES.forEach(()=>{}); // warm
renderNow();
connect();
</script>
